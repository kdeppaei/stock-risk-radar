name: Python tests

on:
  push:
    branches: [main, "codex/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Compile Python modules
        run: python -m compileall -q app.py openkiri_live.py openkiri_cache_policy.py openkiri_integrity.py tools/hash_inspector.py

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Run hash-inspector demo
        run: python tools/hash_inspector.py 098f6bcd4621d373cade4e832627b4f6 --demo OpenKiri-Demo

      - name: Smoke-import deployed app
        run: python -c "import openkiri_live; assert openkiri_live.app.title == 'OpenKiri'"
